<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Redirecting — P2P Share</title>

    <!-- INSTANT URL RESOLVER & INVITE PARAMETER PRESERVER FOR GITHUB PAGES -->
    <script>
        (function() {
            try {
                if (localStorage.getItem('ata_theme') === 'light') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light');
                }
            } catch (e) {}

            var loc = window.location;
            var origin = loc.origin;
            var pathname = loc.pathname || '/';
            var search = loc.search || '';
            var hash = loc.hash || '';

            // Detect GitHub Pages project repository base path (e.g., /p2p-share/) vs custom domain root (/)
            var segments = pathname.split('/').filter(Boolean);
            var basePath = '/';

            if (loc.hostname.endsWith('.github.io') && segments.length > 0) {
                // First segment on username.github.io is the repository name
                basePath = '/' + segments[0] + '/';
            }

            // If a user pasted a token inside the URL path by mistake, rescue it into ?connect=
            if (!search && pathname.indexOf('connect=') !== -1) {
                var extracted = pathname.substring(pathname.indexOf('connect='));
                search = '?' + extracted;
            }

            var targetUrl = origin + basePath + search + hash;
            window.__p2pRedirectTarget = targetUrl;

            // Redirect immediately while preserving browser history cleanliness
            setTimeout(function() {
                window.location.replace(targetUrl);
            }, 120);
        })();
    </script>

    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100dvh;
            overflow: hidden;
        }
        @keyframes shimmerBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.45), 0 0 0 0 rgba(236, 72, 153, 0.3); }
            50% { box-shadow: 0 0 0 14px rgba(99, 102, 241, 0), 0 0 0 24px rgba(236, 72, 153, 0); }
        }
        .bg-animated-gradient {
            background: linear-gradient(120deg, #4f46e5, #6366f1, #ec4899, #06b6d4, #4f46e5);
            background-size: 280% 280%;
            animation: shimmerBg 6s ease infinite;
        }
        .pulse-ring {
            animation: pulseGlow 2s infinite;
        }
        .gradient-border-card {
            border: 1.5px solid transparent;
            background-image: linear-gradient(#0f172a, #0f172a), linear-gradient(135deg, rgba(99,102,241,0.6), rgba(236,72,153,0.6), rgba(56,189,248,0.5));
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }
        .light .gradient-border-card {
            background-image: linear-gradient(#ffffff, #ffffff), linear-gradient(135deg, rgba(99,102,241,0.5), rgba(236,72,153,0.5), rgba(56,189,248,0.5));
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex items-center justify-center p-4 select-none">

    <div class="gradient-border-card rounded-3xl max-w-sm w-full p-7 text-center shadow-2xl relative overflow-hidden">
        <div class="w-16 h-16 rounded-2xl bg-animated-gradient text-white flex items-center justify-center text-2xl mx-auto mb-4 shadow-lg pulse-ring">
            <i class="fas fa-bolt"></i>
        </div>

        <span class="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 text-[10px] font-extrabold uppercase tracking-wider">
            Smart Invite Router
        </span>

        <h1 class="text-lg font-extrabold text-slate-900 dark:text-white mt-3 tracking-tight">
            Launching P2P Share...
        </h1>
        <p id="redirectSubText" class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 leading-relaxed">
            Preserving your direct P2P invite link and connecting you to the hub.
        </p>

        <div class="mt-6">
            <a id="manualRedirectBtn" href="./" class="w-full py-3 px-4 rounded-2xl bg-animated-gradient text-white font-extrabold text-xs shadow-lg flex items-center justify-center gap-2">
                <i class="fas fa-rocket"></i> Continue to P2P Share
            </a>
        </div>
    </div>

    <script>
        (function() {
            var btn = document.getElementById('manualRedirectBtn');
            var sub = document.getElementById('redirectSubText');
            if (btn && window.__p2pRedirectTarget) {
                btn.setAttribute('href', window.__p2pRedirectTarget);
            }
            if (sub && window.location.search.indexOf('connect=') !== -1) {
                sub.textContent = 'Invite token detected! Routing you directly to the peer handshake screen...';
            }
        })();
    </script>
</body>
</html>
